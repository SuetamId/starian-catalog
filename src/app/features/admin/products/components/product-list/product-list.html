<ul class="product-list">
  @for (product of products(); track product.id) {
    <li class="product-list__item">
      <article class="product-list__row">
        <a
          class="product-list__link"
          [routerLink]="['/admin/products', product.id, 'edit']"
          [attr.aria-label]="'Ver detalhes de ' + product.title"
        >
          <app-product-image
            class="product-list__image"
            [src]="product.image"
            [alt]="product.title"
            [width]="64"
            [height]="64"
            fetchPriority="low"
            [deferUntilVisible]="true"
          />
          <div class="product-list__content">
            <div class="product-list__main">
              <h3 class="product-list__title">{{ product.title }}</h3>
              <p class="product-list__description">{{ product.description }}</p>
              <app-category-chip [category]="product.category" />
            </div>
            <div class="product-list__meta">
              <p class="product-list__price">
                {{ product.price | currency: 'BRL' : 'symbol' : '1.2-2' : 'pt-BR' }}
              </p>
            </div>
          </div>
        </a>
        <div class="product-list__actions">
          <a
            class="product-list__action product-list__action--edit"
            [routerLink]="['/admin/products', product.id, 'edit']"
            [attr.aria-label]="'Editar ' + product.title"
          >
            Editar
          </a>
          <button
            class="product-list__action product-list__action--delete"
            type="button"
            [disabled]="isDeleting(product)"
            [attr.aria-label]="'Excluir ' + product.title"
            (click)="requestDelete(product)"
          >
            Excluir
          </button>
        </div>
      </article>
    </li>
  }
</ul>
